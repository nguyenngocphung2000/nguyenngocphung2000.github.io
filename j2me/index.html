<!DOCTYPE html>
<head>
	<title>JS2ME</title>
	<meta charset="utf-8"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<script type="text/javascript" src="js/zip/zip.js"></script>
	<script type="text/javascript" src="js/zip/inflate.js"></script>
	<script type="text/javascript" src="js/zip/zip-ext.js"></script>
	<script type="text/javascript" src="js/js2me.js"></script>
	<script type="text/javascript" src="js/bufferStream.js"></script>
	<script type="text/javascript" src="js/convert.js"></script>
	<script type="text/javascript" src="js/classes.js"></script>
	<script type="text/javascript" src="js/emulator.js"></script>
	<script type="text/javascript" src="js/execute.js"></script>
	<script type="text/javascript" src="js/events.js"></script>
	<script type="text/javascript" src="js/manifest.js"></script>
	<script type="text/javascript" src="js/methodStub.js"></script>
	<script type="text/javascript" src="js/launcher.js"></script>
	<script type="text/javascript" src="js/loader.js"></script>
	<script type="text/javascript" src="js/numbers.js"></script>
	<script type="text/javascript" src="js/resources.js"></script>
	<script type="text/javascript" src="js/threads.js"></script>
	<script type="text/javascript" src="js/workers.js"></script>
	<script type="text/javascript" src="js/utils.js"></script>

    <style>
        /* Ép nền Lõi thành màu đen, giấu đi các bảng báo lỗi/cài đặt gốc */
        html, body, #frame { background: black !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #alert, #settings, #top, #settings-button, #keypad, .topbutton { display: none !important; }
        
        /* Chỉnh lại màn hình thông báo cho đẹp */
        #screen { color: #4ADE80; font-family: monospace; font-size: 14px; text-align: center; padding-top: 40%; font-weight: bold; }
        
        /* Căn giữa Game */
        canvas { display: block !important; max-width: 100%; max-height: 100%; margin: auto; }
    </style>
</head>

<body>
	<div id="frame">
		<div id="screen"></div>
	</div>
    
    <div id="alert" style="display:none;"><div class="message"></div></div>
	<div id="settings" style="display:none;"></div>
	<div id="keypad" style="display:none;"></div>

    <script>
        // Khi iframe được gọi lên, đoạn code này sẽ chạy
        window.addEventListener('load', function() {
            var params = new URLSearchParams(window.location.search);
            var gameUrl = params.get('url');
            var screenDiv = document.getElementById('screen');
            
            if (gameUrl) {
                // In chữ đàng hoàng lên màn hình đen
                screenDiv.innerHTML = "⏳ ĐANG KÉO GAME TỪ KHO...<br><span style='color:#9CA3AF;font-size:10px;font-weight:normal;'>" + gameUrl + "</span>";
                
                fetch(gameUrl)
                    .then(function(res) {
                        if (!res.ok) throw new Error("LỖI 404: KHÔNG TÌM THẤY FILE!");
                        return res.blob();
                    })
                    .then(function(blob) {
                        screenDiv.innerHTML = "✅ TẢI XONG! ĐANG KHỞI ĐỘNG...";
                        
                        // Nặn Blob thành File để nhét vào mồm Lõi
                        var file;
                        try { file = new File([blob], "game.jar", { type: "application/java-archive" }); } 
                        catch (e) { file = blob; file.name = "game.jar"; }
                        
                        // Canh chừng Lõi tải xong các file JS thì bơm game vào
                        var waitCore = setInterval(function() {
                            if (window.js2me && typeof window.js2me.loadJAR === 'function') {
                                clearInterval(waitCore);
                                screenDiv.style.display = 'none'; // Giấu đoạn chữ thông báo đi để hiện Game
                                window.js2me.loadJAR(file);
                            }
                        }, 100);
                    })
                    .catch(function(err) {
                        screenDiv.innerHTML = "<span style='color:#F87171'>❌ " + err.message + "</span>";
                    });
            } else {
                screenDiv.innerHTML = "<span style='color:#9CA3AF'>CHƯA CHỌN BĂNG GAME</span>";
            }
        });
    </script>
</body>
</html>
