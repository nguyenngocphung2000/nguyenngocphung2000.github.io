<!DOCTYPE html>
<head>
	<title>JS2ME</title>
	<link rel="stylesheet" type="text/css" href="css/buttons.css">
	<link rel="stylesheet" type="text/css" href="css/emulator.css">
	<meta charset="utf-8"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<script type="text/javascript" src="js/zip/zip.js"></script>
	<script type="text/javascript" src="js/zip/inflate.js"></script>
	<script type="text/javascript" src="js/zip/zip-ext.js"></script>
	<script type="text/javascript" src="js/js2me.js"></script>
	<script type="text/javascript" src="js/bufferStream.js"></script>
	<script type="text/javascript" src="js/convert.js"></script>
	<script type="text/javascript" src="js/classes.js"></script>
	<script type="text/javascript" src="js/emulator.js"></script>
	<script type="text/javascript" src="js/execute.js"></script>
	<script type="text/javascript" src="js/events.js"></script>
	<script type="text/javascript" src="js/manifest.js"></script>
	<script type="text/javascript" src="js/methodStub.js"></script>
	<script type="text/javascript" src="js/launcher.js"></script>
	<script type="text/javascript" src="js/loader.js"></script>
	<script type="text/javascript" src="js/numbers.js"></script>
	<script type="text/javascript" src="js/resources.js"></script>
	<script type="text/javascript" src="js/threads.js"></script>
	<script type="text/javascript" src="js/workers.js"></script>
	<script type="text/javascript" src="js/utils.js"></script>

    <style>
        /* 1. KHÓA CHẶT MỌI THÔNG BÁO LỖI VÀ MENU CÀI ĐẶT ĂN VẠ CỦA LÕI */
        #alert, #settings, #top, #settings-button, #keypad, .topbutton { 
            display: none !important; 
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        /* 2. Ép toàn bộ nền thành màu đen để hòa làm một với web của bạn */
        html, body { 
            background: black !important; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        
        #frame { 
            background: black !important; 
            border: none !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        
        /* 3. Khung hiển thị Game */
        #screen { 
            background: black !important; 
            color: #4ADE80; /* Màu chữ xanh lá cây */
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            height: 100%; 
            font-family: monospace;
            font-size: 14px;
            text-align: center;
        }

        canvas { 
            display: block !important; 
            max-width: 100%; 
            max-height: 100%; 
            margin: auto;
        }
    </style>

    <script>
        window.addEventListener('load', function() {
            var params = new URLSearchParams(window.location.search);
            var gameUrl = params.get('url');
            var screenDiv = document.getElementById('screen');
            
            if (gameUrl) {
                // Xóa ảnh nút tải file mặc định, thay bằng chữ tải game
                screenDiv.innerHTML = "⏳ Đang kéo game từ kho...<br><br><span style='font-size:10px;color:#9CA3AF;'>" + gameUrl + "</span>";
                
                fetch(gameUrl)
                    .then(function(res) {
                        if (!res.ok) throw new Error("404: Không tìm thấy file game!");
                        return res.blob();
                    })
                    .then(function(blob) {
                        screenDiv.innerHTML = "✅ Tải xong! Đang ép xung Lõi...";
                        
                        var file;
                        try {
                            file = new File([blob], "game.jar", { type: "application/java-archive" });
                        } catch (e) {
                            file = blob;
                            file.name = "game.jar";
                        }
                        
                        // Rình lúc Lõi JS2ME sẵn sàng thì bơm file vào
                        var waitCore = setInterval(function() {
                            if (window.js2me && typeof window.js2me.loadJAR === 'function') {
                                clearInterval(waitCore);
                                screenDiv.innerHTML = ""; // Xóa chữ để nhường chỗ cho Game
                                window.js2me.loadJAR(file); // Bơm Game
                            }
                        }, 100);
                    })
                    .catch(function(err) {
                        screenDiv.innerHTML = "<span style='color:#F87171'>❌ LỖI: " + err.message + "</span>";
                    });
            } else {
                screenDiv.innerHTML = "<span style='color:#9CA3AF'>Chưa có lệnh tải game.</span>";
            }
        });
    </script>
    </head>
<body>
	<div id="frame">
		<button class="topbutton" id="show" >&gt;</button>
		<div id="top">
			<button class="topbutton" id="hide">&lt;</button><div id="title"></div><button class="topbutton" id="exit">X</button>
		</div>
		<button class="topbutton" id="settings-button">i</button>
        
		<div id="screen">
            Select JAR file:<br>
 			<img id="file-selector" src="img/arrow_up.png" width="128" height="128">
		</div>
        
		<div id="keypad">
			<div id="joypad">
				<button id="up" class="key num">&nbsp;</button><br>
				<button id="left" class="key num">&nbsp;</button>
				<button id="ok" class="key num">&nbsp;</button>
				<button id="right" class="key num">&nbsp;</button><br>
				<button id="down" class="key num">&nbsp;</button>
			</div>
			
			<button id="choice" class="softkey">&nbsp;</button>
			<button id="open-joypad" class="key">&nbsp;</button>
			<button id="back" class="softkey">&nbsp;</button><br>
			
			<button id="num1" class="key num">1</button>
			<button id="num2" class="key num">2</button>
			<button id="num3" class="key num">3</button><br>
			<button id="num4" class="key num">4</button>
			<button id="num5" class="key num">5</button>
			<button id="num6" class="key num">6</button><br>
			<button id="num7" class="key num">7</button>
			<button id="num8" class="key num">8</button>
			<button id="num9" class="key num">9</button><br>
			<button id="star" class="key num">*</button>
			<button id="num0" class="key num">0</button>
			<button id="pound" class="key num">#</button><br>
		</div>
	</div>
    
    <div id="alert">
		<div class="message">Error!</div>
	</div>
	<div id="settings">
		<div class="dialog">
			<div class="options">
				<div class="option">
					<label>Screen resolution (requires reload):</label>
					<select class="screen-size">
						<option value="128,96,128">128x128</option>
						<option value="176,176,220">176x220</option>
						<option value="240,266,320">240x320</option>
					</select>
				</div>
				<div class="option">
					<button class="generate-methods">Generate methods</button>
					<aside>May take long time</aside>
				</div>
			</div>
			<button class="done">Done</button>
		</div>
	</div>
</body>
