<!DOCTYPE html>
<html>
<head>
    <title>JS2ME</title>
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    
    <script type="text/javascript" src="js/zip/zip.js"></script>
    <script>if (window.zip) { zip.useWebWorkers = false; }</script>

    <script type="text/javascript" src="js/zip/inflate.js"></script>
    <script type="text/javascript" src="js/zip/zip-ext.js"></script>
    <script type="text/javascript" src="js/js2me.js"></script>
    <script type="text/javascript" src="js/bufferStream.js"></script>
    <script type="text/javascript" src="js/convert.js"></script>
    <script type="text/javascript" src="js/classes.js"></script>
    <script type="text/javascript" src="js/emulator.js"></script>
    <script type="text/javascript" src="js/execute.js"></script>
    <script type="text/javascript" src="js/events.js"></script>
    <script type="text/javascript" src="js/manifest.js"></script>
    <script type="text/javascript" src="js/methodStub.js"></script>
    <script type="text/javascript" src="js/launcher.js"></script>
    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/numbers.js"></script>
    <script type="text/javascript" src="js/resources.js"></script>
    <script type="text/javascript" src="js/threads.js"></script>
    <script type="text/javascript" src="js/workers.js"></script>
    <script type="text/javascript" src="js/utils.js"></script>

    <style>
        /* Màn hình đen nguyên khối */
        html, body, #frame { background: black !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; border: none; }
        
        /* Dọn dẹp mấy cái viền và rác thừa của bản cũ */
        #top, #settings-button, #keypad, .topbutton, #file-selector { display: none !important; }
        #screen { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; color: #9CA3AF; font-family: monospace; font-size: 12px;}
        
        /* Canh giữa hình ảnh Game */
        canvas { display: block !important; max-width: 100%; max-height: 100%; margin: auto; border-radius: 8px; }

        /* TÂN TRANG BẢNG ĐỘ PHÂN GIẢI - CHÌA KHÓA VÀO GAME */
        #settings { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; }
        #settings .dialog { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2937; padding: 25px; border-radius: 16px; border: 2px solid #4F46E5; text-align: center; font-family: sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 85%; max-width: 280px; }
        #settings label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: bold; color: #a5b4fc; text-transform: uppercase; }
        #settings select { background: #374151; color: white; border: 1px solid #4b5563; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 20px; outline: none; font-weight: bold; text-align: center; }
        #settings .done { background: #4F46E5; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4); }
        #settings .done:active { background: #4338ca; transform: scale(0.95); }
        #settings aside, #settings .generate-methods { display: none !important; }
        
        /* Bảng hiển thị lỗi gốc */
        #alert { position: absolute; top: 10px; left: 10px; right: 10px; background: #ef4444; color: white; padding: 10px; border-radius: 8px; text-align: center; font-family: sans-serif; font-size: 12px; font-weight: bold; z-index: 10000; }
    </style>
</head>
<body>
    <div id="frame"><div id="screen">ĐANG KHỞI ĐỘNG CỖ MÁY...</div></div>
    
    <div id="alert" style="display:none;"><div class="message">Error!</div></div>
    <div id="keypad" style="display:none;"></div>
    
    <div id="settings" style="display:none;">
        <div class="dialog">
            <div class="options">
                <div class="option">
                    <label>🕹️ Độ phân giải Game</label>
                    <select class="screen-size">
                        <option value="240,266,320" selected>240 x 320 (Chuẩn)</option>
                        <option value="320,320,240">320 x 240 (Ngang)</option>
                        <option value="176,176,220">176 x 220 (Nhỏ)</option>
                    </select>
                </div>
                <div class="option">
                    <button class="generate-methods">Generate</button>
                    <aside>Wait</aside>
                </div>
            </div>
            <button class="done">VÀO GAME NGAY 🚀</button>
        </div>
    </div>
</body>
</html>
