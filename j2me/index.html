<!DOCTYPE html>
<html>
<head>
    <title>JS2ME Lõi Debug</title>
    <meta charset="utf-8"> 
    
    <script type="text/javascript" src="js/zip/zip.js"></script>
    <script>if (window.zip) { zip.useWebWorkers = false; }</script>
    
    <script type="text/javascript" src="js/zip/inflate.js"></script>
    <script type="text/javascript" src="js/zip/zip-ext.js"></script>
    <script type="text/javascript" src="js/js2me.js"></script>
    <script type="text/javascript" src="js/bufferStream.js"></script>
    <script type="text/javascript" src="js/convert.js"></script>
    <script type="text/javascript" src="js/classes.js"></script>
    <script type="text/javascript" src="js/emulator.js"></script>
    <script type="text/javascript" src="js/execute.js"></script>
    <script type="text/javascript" src="js/events.js"></script>
    <script type="text/javascript" src="js/manifest.js"></script>
    <script type="text/javascript" src="js/methodStub.js"></script>
    <script type="text/javascript" src="js/launcher.js"></script>
    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/numbers.js"></script>
    <script type="text/javascript" src="js/resources.js"></script>
    <script type="text/javascript" src="js/threads.js"></script>
    <script type="text/javascript" src="js/workers.js"></script>
    <script type="text/javascript" src="js/utils.js"></script>

    <style>
        body { background: #000; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden; }
        
        /* Bảng điện tâm đồ báo lỗi */
        #monitor { width: 100%; height: 110px; background: rgba(20,20,20,1); font-family: monospace; font-size: 10px; overflow-y: auto; padding: 8px; box-sizing: border-box; border-bottom: 2px solid #4F46E5; z-index: 100; }
        
        #frame { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative; }
        
        /* Khung hiển thị Game */
        #screen { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: transparent; }
        canvas { border: 2px dashed #4F46E5; max-width: 100%; max-height: 100%; background: #000; display: block !important; }
        
        /* Dọn sạch rác cũ */
        #alert, #settings, #top, .topbutton, #keypad, #file-selector { display: none !important; }
    </style>
</head>
<body>
    <div id="monitor">
        <span style="color:#4ADE80">HỆ THỐNG KIỂM SOÁT LÕI ĐÃ KÍCH HOẠT...</span><br>
    </div>
    
    <div id="frame">
        <div id="screen">Select JAR file:<br><img id="file-selector" src="img/arrow_up.png"></div>
    </div>

    <script>
        var monitor = document.getElementById('monitor');
        function logMsg(msg, color) {
            monitor.innerHTML += '<span style="color:' + (color || '#D1D5DB') + '">' + msg + '</span><br>';
            monitor.scrollTop = monitor.scrollHeight;
        }

        // Bắt trọn mọi suy nghĩ và lỗi của Lõi in lên màn hình
        var originalConsoleLog = console.log;
        var originalConsoleError = console.error;
        
        console.log = function(msg) { 
            logMsg("LÕI: " + msg, '#9CA3AF'); 
            originalConsoleLog && originalConsoleLog.apply(console, arguments); 
        };
        console.error = function(msg) { 
            logMsg("LỖI JAVA: " + msg, '#EF4444'); 
            originalConsoleError && originalConsoleError.apply(console, arguments); 
        };
        window.onerror = function(msg) { 
            logMsg("LỖI HỆ THỐNG: " + msg, '#EF4444'); 
        };

        // Báo cáo khi bắt đầu bung nén
        if (window.js2me) {
            var originalLoadJAR = js2me.loadJAR;
            js2me.loadJAR = function(file) {
                logMsg("Đã nhận lệnh bung nén băng game: " + (file.name || "game.jar"), "#FCD34D");
                if (originalLoadJAR) {
                    originalLoadJAR.apply(this, arguments);
                }
            };
        } else {
            logMsg("LỖI NGHIÊM TRỌNG: Thư viện js2me không tồn tại!", "#EF4444");
        }
    </script>
</body>
</html>
