<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cu Cộng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-800 pb-20">

    <header class="sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-orange-100">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-orange-500 text-white px-3 py-1 rounded-lg font-bold">Cu Cộng</div>
                <span class="font-bold text-gray-500 uppercase text-[10px] tracking-widest hidden sm:block">No Nothing</span>
            </div>
            
            <nav id="desktop-nav" class="hidden md:flex items-center space-x-2 text-sm text-gray-600"></nav>

            <button id="mobile-menu-btn" class="md:hidden p-2 text-gray-600 hover:text-orange-500 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-orange-50 absolute w-full shadow-lg">
            <div id="mobile-nav" class="flex flex-col py-2"></div>
        </div>
    </header>

    <main id="app-container" class="max-w-4xl mx-auto px-4 mt-8"></main>

    <script src="script.js"></script>
</body>
</html>
